name: Publish

env:
  DEBUG: napi:*
  APP_NAME: aws-nitro-enclaves-nsm-api
  MACOSX_DEPLOYMENT_TARGET: "10.13"
  CARGO_INCREMENTAL: "1"

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      release_type:
        description: Semver release type
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
      upstream_version:
        description: Optional upstream crate version to record and build against
        required: false
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve-release:
    name: Resolve release
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.resolve.outputs.should_release }}
      release_type: ${{ steps.resolve.outputs.release_type }}
      upstream_version: ${{ steps.resolve.outputs.upstream_version }}
    steps:
      - uses: actions/checkout@v6
      - name: Check upstream crate
        id: check
        if: ${{ github.event_name == 'schedule' }}
        run: node scripts/check-upstream-version.mjs
      - name: Resolve release inputs
        id: resolve
        env:
          MANUAL_RELEASE_TYPE: ${{ inputs.release_type }}
          MANUAL_UPSTREAM_VERSION: ${{ inputs.upstream_version }}
          SCHEDULE_SHOULD_RELEASE: ${{ steps.check.outputs.should_release }}
          SCHEDULE_RELEASE_TYPE: ${{ steps.check.outputs.release_type }}
          SCHEDULE_UPSTREAM_VERSION: ${{ steps.check.outputs.latest_version }}
        run: |
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            echo "should_release=${SCHEDULE_SHOULD_RELEASE}" >> "$GITHUB_OUTPUT"
            echo "release_type=${SCHEDULE_RELEASE_TYPE}" >> "$GITHUB_OUTPUT"
            echo "upstream_version=${SCHEDULE_UPSTREAM_VERSION}" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "release_type=${MANUAL_RELEASE_TYPE}" >> "$GITHUB_OUTPUT"
            echo "upstream_version=${MANUAL_UPSTREAM_VERSION}" >> "$GITHUB_OUTPUT"
          fi
      - name: Summarize
        run: |
          echo "Should release: ${{ steps.resolve.outputs.should_release }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Release type: ${{ steps.resolve.outputs.release_type }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Upstream version: ${{ steps.resolve.outputs.upstream_version || 'unchanged' }}" >> "$GITHUB_STEP_SUMMARY"

  lint:
    name: Lint
    needs:
      - resolve-release
    if: ${{ needs.resolve-release.outputs.should_release == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Apply upstream version
        if: ${{ needs.resolve-release.outputs.upstream_version != '' }}
        run: |
          node scripts/set-upstream-version.mjs "${{ needs.resolve-release.outputs.upstream_version }}"
          cargo update -p aws-nitro-enclaves-nsm-api --precise "${{ needs.resolve-release.outputs.upstream_version }}"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint

  build:
    name: Build ${{ matrix.settings.target }}
    needs:
      - resolve-release
    if: ${{ needs.resolve-release.outputs.should_release == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: macos-15-intel
            target: x86_64-apple-darwin
            build_args: --target x86_64-apple-darwin
          - host: macos-15
            target: aarch64-apple-darwin
            build_args: --target aarch64-apple-darwin
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            build_args: --target x86_64-unknown-linux-gnu --use-napi-cross
          - host: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            build_args: --target aarch64-unknown-linux-gnu --use-napi-cross
    runs-on: ${{ matrix.settings.host }}
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.settings.target }}
      - name: Apply upstream version
        if: ${{ needs.resolve-release.outputs.upstream_version != '' }}
        run: |
          node scripts/set-upstream-version.mjs "${{ needs.resolve-release.outputs.upstream_version }}"
          cargo update -p aws-nitro-enclaves-nsm-api --precise "${{ needs.resolve-release.outputs.upstream_version }}"
      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ~/.napi-rs
            .cargo-cache
            target/
          key: ${{ matrix.settings.host }}-${{ matrix.settings.target }}-cargo-${{ needs.resolve-release.outputs.upstream_version || hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ matrix.settings.host }}-${{ matrix.settings.target }}-cargo-
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build
        run: bun run build ${{ matrix.settings.build_args }}
        shell: bash
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: bindings-${{ matrix.settings.target }}
          path: |
            dist/index.js
            dist/index.d.ts
            dist/${{ env.APP_NAME }}.*.node
            dist/${{ env.APP_NAME }}.*.wasm
          if-no-files-found: error

  test-bindings:
    name: Test ${{ matrix.settings.target }}
    needs:
      - resolve-release
      - build
    if: ${{ needs.resolve-release.outputs.should_release == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: macos-15-intel
            target: x86_64-apple-darwin
          - host: macos-15
            target: aarch64-apple-darwin
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - host: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.settings.host }}
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: bindings-${{ matrix.settings.target }}
          path: dist
      - name: List package output
        run: ls -R dist
        shell: bash
      - name: Import binding
        run: bun run smoke

  # Perry vendor prebuilts: release staticlibs for each supported
  # OS/arch so consumers can `perry compile` without a Rust toolchain.
  # Layout matches package.json `perry.nativeLibrary.targets.<os>-<arch>.prebuilt`.
  build-perry-prebuilt:
    name: Perry prebuilt ${{ matrix.settings.perry_arch }}
    needs:
      - resolve-release
    if: ${{ needs.resolve-release.outputs.should_release == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: macos-15-intel
            rust_target: x86_64-apple-darwin
            perry_arch: macos-x64
          - host: macos-15
            rust_target: aarch64-apple-darwin
            perry_arch: macos-arm64
          - host: ubuntu-latest
            rust_target: x86_64-unknown-linux-gnu
            perry_arch: linux-x64
          - host: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-gnu
            perry_arch: linux-arm64
    runs-on: ${{ matrix.settings.host }}
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.settings.rust_target }}
      - name: Apply upstream version
        if: ${{ needs.resolve-release.outputs.upstream_version != '' }}
        run: |
          node scripts/set-upstream-version.mjs "${{ needs.resolve-release.outputs.upstream_version }}"
          cargo update -p aws-nitro-enclaves-nsm-api --precise "${{ needs.resolve-release.outputs.upstream_version }}"
      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            .cargo-cache
            target/
          key: perry-prebuilt-${{ matrix.settings.host }}-${{ matrix.settings.rust_target }}-${{ needs.resolve-release.outputs.upstream_version || hashFiles('Cargo.lock') }}
          restore-keys: |
            perry-prebuilt-${{ matrix.settings.host }}-${{ matrix.settings.rust_target }}-
      - name: Build and stage Perry staticlib
        run: bun run build:perry:prebuilt -- --target ${{ matrix.settings.rust_target }}
      - name: Upload Perry prebuilt
        uses: actions/upload-artifact@v7
        with:
          name: perry-prebuilt-${{ matrix.settings.perry_arch }}
          path: prebuilt/${{ matrix.settings.perry_arch }}/libaws_nitro_enclaves_nsm_api.a
          if-no-files-found: error

  publish:
    name: Publish to npm
    needs:
      - resolve-release
      - lint
      - test-bindings
      - build-perry-prebuilt
    if: ${{ needs.resolve-release.outputs.should_release == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu
      - name: Validate release type
        run: |
          case "${{ needs.resolve-release.outputs.release_type }}" in
            patch|minor|major) ;;
            *) echo "release_type must be patch, minor, or major" >&2; exit 1 ;;
          esac
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Apply upstream version
        if: ${{ needs.resolve-release.outputs.upstream_version != '' }}
        run: |
          node scripts/set-upstream-version.mjs "${{ needs.resolve-release.outputs.upstream_version }}"
          cargo update -p aws-nitro-enclaves-nsm-api --precise "${{ needs.resolve-release.outputs.upstream_version }}"
      - name: Download N-API artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: bindings-*
          path: dist
          merge-multiple: true
      - name: Download Perry prebuilts
        uses: actions/download-artifact@v8
        with:
          pattern: perry-prebuilt-*
          path: perry-prebuilt-artifacts
      - name: Stage Perry prebuilts into package layout
        run: |
          set -euo pipefail
          for dir in perry-prebuilt-artifacts/perry-prebuilt-*; do
            [ -d "$dir" ] || continue
            arch="${dir##*/perry-prebuilt-}"
            mkdir -p "prebuilt/${arch}"
            cp "$dir"/libaws_nitro_enclaves_nsm_api.a "prebuilt/${arch}/"
          done
          echo "Staged Perry prebuilts:"
          find prebuilt -type f -print
          # Fail the release if any declared vendor prebuilt is missing.
          for arch in macos-arm64 macos-x64 linux-arm64 linux-x64; do
            test -f "prebuilt/${arch}/libaws_nitro_enclaves_nsm_api.a" \
              || { echo "missing prebuilt/${arch}/libaws_nitro_enclaves_nsm_api.a" >&2; exit 1; }
          done
      - name: Release
        run: bun run release -- "${{ needs.resolve-release.outputs.release_type }}" --ci
