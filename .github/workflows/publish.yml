name: Publish

env:
  DEBUG: napi:*
  APP_NAME: aws-nitro-enclaves-nsm-api
  MACOSX_DEPLOYMENT_TARGET: "10.13"
  CARGO_INCREMENTAL: "1"

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: Semver release type
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
      upstream_version:
        description: Optional upstream crate version to record and build against
        required: false
        type: string
  workflow_call:
    inputs:
      release_type:
        description: Semver release type
        required: true
        type: string
      upstream_version:
        description: Optional upstream crate version to record and build against
        required: false
        type: string
    secrets:
      NPM_TOKEN:
        required: true

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Apply upstream version
        if: ${{ inputs.upstream_version != '' }}
        run: |
          node scripts/set-upstream-version.mjs "${{ inputs.upstream_version }}"
          cargo update -p aws-nitro-enclaves-nsm-api --precise "${{ inputs.upstream_version }}"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint

  build:
    name: Build ${{ matrix.settings.target }}
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: macos-15-intel
            target: x86_64-apple-darwin
            build_args: --target x86_64-apple-darwin
          - host: macos-15
            target: aarch64-apple-darwin
            build_args: --target aarch64-apple-darwin
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            build_args: --target x86_64-unknown-linux-gnu --use-napi-cross
          - host: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            build_args: --target aarch64-unknown-linux-gnu --use-napi-cross
    runs-on: ${{ matrix.settings.host }}
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.settings.target }}
      - name: Apply upstream version
        if: ${{ inputs.upstream_version != '' }}
        run: |
          node scripts/set-upstream-version.mjs "${{ inputs.upstream_version }}"
          cargo update -p aws-nitro-enclaves-nsm-api --precise "${{ inputs.upstream_version }}"
      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ~/.napi-rs
            .cargo-cache
            target/
          key: ${{ matrix.settings.host }}-${{ matrix.settings.target }}-cargo-${{ inputs.upstream_version || hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ matrix.settings.host }}-${{ matrix.settings.target }}-cargo-
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build
        run: bun run build ${{ matrix.settings.build_args }}
        shell: bash
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: bindings-${{ matrix.settings.target }}
          path: |
            dist/index.js
            dist/index.d.ts
            dist/${{ env.APP_NAME }}.*.node
            dist/${{ env.APP_NAME }}.*.wasm
          if-no-files-found: error

  test-bindings:
    name: Test ${{ matrix.settings.target }}
    needs:
      - build
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: macos-15-intel
            target: x86_64-apple-darwin
          - host: macos-15
            target: aarch64-apple-darwin
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - host: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.settings.host }}
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: bindings-${{ matrix.settings.target }}
          path: dist
      - name: List package output
        run: ls -R dist
        shell: bash
      - name: Import binding
        run: bun run smoke

  publish:
    name: Publish to npm
    needs:
      - lint
      - test-bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu
      - name: Validate release type
        run: |
          case "${{ inputs.release_type }}" in
            patch|minor|major) ;;
            *) echo "release_type must be patch, minor, or major" >&2; exit 1 ;;
          esac
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Apply upstream version
        if: ${{ inputs.upstream_version != '' }}
        run: |
          node scripts/set-upstream-version.mjs "${{ inputs.upstream_version }}"
          cargo update -p aws-nitro-enclaves-nsm-api --precise "${{ inputs.upstream_version }}"
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: bindings-*
          path: dist
          merge-multiple: true
      - name: Authenticate npm
        run: npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Release
        run: bun run release -- "${{ inputs.release_type }}" --ci
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
